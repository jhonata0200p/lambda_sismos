services:
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark_master
    hostname: spark-master
    command: ["/bin/bash", "-c", "python3 /opt/spark/apps/spark_trigger_server.py & exec /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"   # UI Web del Master
      - "7077:7077"   # Puerto interno del Cluster
      - "5050:5050"   # Servidor Trigger HTTP para Airflow
    volumes:
      - ./apps:/opt/spark/apps
    networks:
      - red_compartida
    restart: always

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark_worker_1
    hostname: spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    ports:
      - "8081:8081"   # UI Web del Worker
    volumes:
      - ./apps:/opt/spark/apps
    networks:
      - red_compartida
    depends_on:
      - spark-master
    restart: always

  spark-streaming:
    image: apache/spark:3.5.0
    container_name: spark_streaming
    hostname: spark-streaming
    user: "0:0"
    depends_on:
      - spark-master
      - spark-worker
    volumes:
      - ./apps:/opt/spark/apps
    networks:
      - red_compartida
    restart: always
    command:
      - /bin/bash
      - -c
      - |
        pip install --no-cache-dir psycopg2-binary minio
        echo "Esperando que Spark Master y Worker esten listos..."
        sleep 5
        echo "Iniciando Spark Streaming Job continuo contra Kafka..."
        exec /opt/spark/bin/spark-submit \
          --master spark://spark-master:7077 \
          --jars /opt/spark/apps/jars/spark-sql-kafka-0-10_2.12-3.5.0.jar,/opt/spark/apps/jars/spark-token-provider-kafka-0-10_2.12-3.5.0.jar,/opt/spark/apps/jars/kafka-clients-3.4.1.jar,/opt/spark/apps/jars/commons-pool2-2.11.1.jar \
          /opt/spark/apps/spark_streaming_job.py

networks:
  red_compartida:
    name: red_bigdata
    external: true
