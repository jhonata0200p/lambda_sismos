version: "3.8"

services:
  # ==============================================================================
  # APACHE ATLAS 2.3.0: Motor Central de Gobernanza, Linaje de Datos y Metadatos
  # ==============================================================================
  apache-atlas:
    image: sburn/apache-atlas:2.3.0
    container_name: apache_atlas
    ports:
      - "21000:21000" # Interfaz Web y API REST v2 de Atlas
    environment:
      - MANAGE_LOCAL_HBASE=true
      - MANAGE_LOCAL_SOLR=true
    deploy:
      resources:
        limits:
          memory: 5120M # Límite estricto de 5.0 GB de RAM para proteger la máquina
          cpus: "2.0"
    restart: unless-stopped
