version: "3.8"

services:
  # 1. APACHE ATLAS: Linaje Técnico Automático y Trazabilidad
  apache-atlas:
    image: sburn/apache-atlas:2.3.0
    container_name: apache_atlas
    ports:
      - "21000:21000" # Interfaz Web de Atlas
    environment:
      - MANAGE_LOCAL_HBASE=true
      - MANAGE_LOCAL_SOLR=true
    networks:
      - red_compartida
    restart: always

  # 2. OPENMETADATA: Catálogo de Datos, Diccionario y Pruebas de Calidad
  openmetadata-server:
    image: openmetadata/server:1.3.0
    container_name: openmetadata_server
    ports:
      - "8585:8585" # Interfaz Web de OpenMetadata
    environment:
      SERVER_HOST_API_URL: http://localhost:8585/api
      DB_USER: postgres_user
      DB_PASSWORD: password123
      DB_HOST: postgres_serving
      DB_PORT: 5432
      OPENMETADATA_DATABASE: openmetadata_db
    networks:
      - red_compartida
    restart: always

networks:
  red_compartida:
    name: red_bigdata
    external: true
