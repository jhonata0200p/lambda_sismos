services:
  # ==============================================================================
  # APACHE ATLAS 2.3.0: Motor Central de Gobernanza, Linaje de Datos y Metadatos
  # ==============================================================================
  apache-atlas:
    image: sburn/apache-atlas:2.3.0
    container_name: apache_atlas
    ports:
      - "21000:21000" # Interfaz Web y API REST v2 de Atlas
    environment:
      - MANAGE_LOCAL_HBASE=true
      - MANAGE_LOCAL_SOLR=true
    command:
      - /bin/bash
      - -c
      - |
        sed -i 's/atlas.kafka.zookeeper.connection.timeout.ms=200/atlas.kafka.zookeeper.connection.timeout.ms=30000/g' /apache-atlas/conf/atlas-application.properties
        sed -i 's/atlas.kafka.zookeeper.session.timeout.ms=400/atlas.kafka.zookeeper.session.timeout.ms=30000/g' /apache-atlas/conf/atlas-application.properties
        sed -i 's/atlas.kafka.zookeeper.sync.time.ms=20/atlas.kafka.zookeeper.sync.time.ms=2000/g' /apache-atlas/conf/atlas-application.properties
        rm -rf /apache-atlas/data/kafka/zk/* /apache-atlas/data/kafka/kafka/* 2>/dev/null || true
        /apache-atlas/bin/atlas_start.py
        tail -fF /apache-atlas/logs/application.log
    deploy:
      resources:
        limits:
          memory: 4096M
    restart: unless-stopped
